# Project-wide Gradle settings.

# JVM args — 2GB heap. Compose + Kotlin compilation is memory-hungry;
# anything less and Gradle intermittently OOMs on first build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX — required since we use AndroidX libraries throughout.
android.useAndroidX=true

# Kotlin code style — official (IDE-friendly).
kotlin.code.style=official

# Non-transitive R class — faster builds, smaller R classes. Each module's
# R class only contains its own resources, not those of dependencies.
android.nonTransitiveRClass=true

# Gradle build cache + parallel — significantly faster incremental builds.
org.gradle.caching=true
org.gradle.parallel=true

# Only fail the build if a configuration is both requested AND cannot be
# resolved (vs. failing eagerly for every configuration in the project).
org.gradle.configureondemand=false
